<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tenby — End-of-Game Scorecard</title>
  <meta name="description" content="A cozy, mobile-first end-of-game scorecard for the Tenby board game (1–5 players)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A2E3B'/%3E%3Cpath d='M10 46V26l11-8 11 8v20H10z' fill='%23E87A64'/%3E%3Cpath d='M26 46V22l11-8 11 8v24H26z' fill='%23F2C14E'/%3E%3Cpath d='M42 46V28l12-7v25H42z' fill='%234FB3A5'/%3E%3Cpath d='M6 48c6 3 12 3 18 0s12-3 18 0 12 3 16 0v6H6v-6z' fill='%235B9BD5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <div class="terrace-stripe" aria-hidden="true">
    <span style="background: var(--pawn-coral)"></span>
    <span style="background: var(--pawn-yellow)"></span>
    <span style="background: var(--pawn-teal)"></span>
    <span style="background: var(--pawn-blue)"></span>
    <span style="background: var(--pawn-plum)"></span>
  </div>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 30V15l7-5 7 5v15H4z" fill="#E87A64"/>
            <path d="M14 30V12l7-5 7 5v18H14z" fill="#F2C14E"/>
            <path d="M24 30V16l7-5 5 4v15H24z" fill="#4FB3A5"/>
            <path d="M2 31.5c4.5 2.5 9 2.5 13.5 0s9-2.5 13.5 0 6.5 2 9 .5v4H2v-4.5z" fill="#5B9BD5"/>
          </svg>
        </div>
        <div>
          <h1>Tenby Scorecard</h1>
          <p class="subtitle">End-of-game coastal town tally</p>
        </div>
      </div>

      <div class="header-controls" role="toolbar" aria-label="Game settings">
        <div class="player-count-control" aria-label="Player count">
          <span class="control-label">Players</span>
          <div class="segmented" id="player-count-buttons">
            <button type="button" data-count="1" aria-label="1 Player Solo">1P</button>
            <button type="button" data-count="2" aria-label="2 Players">2</button>
            <button type="button" data-count="3" aria-label="3 Players">3</button>
            <button type="button" data-count="4" aria-label="4 Players">4</button>
            <button type="button" data-count="5" aria-label="5 Players">5</button>
          </div>
        </div>

        <button
          type="button"
          id="toggle-distinctions"
          class="toggle-chip"
          aria-pressed="true"
          title="Include Distinction / Accolade cards in scoring"
        >
          <span class="toggle-dot" aria-hidden="true"></span>
          Distinctions
        </button>

        <button type="button" id="reset-btn" class="btn-secondary" title="Clear all scores for a new game">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          New Game
        </button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <!-- Mobile player switcher pills -->
    <nav class="mobile-player-tabs" id="mobile-player-tabs" aria-label="Select player to score"></nav>

    <!-- Player scoring cards -->
    <section class="players-grid" id="players-grid" aria-label="Player scorecards"></section>

    <!-- Live Standings / Solo Summary -->
    <section class="standings-section" id="standings-section" aria-label="Final standings"></section>
  </main>

  <footer class="app-footer">
    <p>
      Tiebreakers: <strong>1st</strong> Most completed streets &middot; <strong>2nd</strong> Most Resident card points.
      Life Ring tokens score 0 pts at end of game.
    </p>
  </footer>

  <script src="app.js?v=6"></script>
</body>
</html>
